<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Uma animação com o professor Woody sobre a Semana de Arte Moderna de 1922.">
  <title>O lápis de 1922</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 42%, #fffdf8 0 25%, #f1e8d7 100%);
    }

    .scene {
      --ink: #211a16;
      width: min(92vw, 82vh, 540px);
      aspect-ratio: 1 / 1;
      position: relative;
      container-type: inline-size;
    }

    .shadow {
      position: absolute;
      left: 37%;
      top: 90%;
      width: 37%;
      height: 4%;
      background: #80522636;
      border-radius: 50%;
      filter: blur(6px);
      animation: shadow 4.2s ease-in-out infinite;
    }

    .pencil {
      position: absolute;
      z-index: 1;
      left: 38%;
      top: 8%;
      width: 26%;
      height: 78%;
      transform: rotate(11deg);
      transform-origin: 50% 72%;
      animation: float 4.2s ease-in-out infinite;
    }

    .eraser, .ferrule, .wood, .barrel { position: absolute; inset-inline: 0; }

    .eraser {
      top: 0;
      height: 17%;
      border: 1cqw solid var(--ink);
      border-radius: 24% 30% 16% 16% / 52% 55% 20% 20%;
      background: linear-gradient(108deg, #ffd2d1, #ef929b 30% 75%, #bf5968 76%);
      box-shadow: inset .7cqw .8cqw #ffe3dc;
    }

    .ferrule {
      z-index: 4;
      top: 12%;
      left: -4%;
      right: -4%;
      height: 14%;
      border: 1cqw solid var(--ink);
      border-radius: 13% / 30%;
      background:
        linear-gradient(0deg, #5e6669 0 12%, transparent 12% 46%, #4b4f53 47% 53%, transparent 54% 83%, #f8fafa 83%),
        linear-gradient(105deg, #8a9396, #e0e4e3 33% 72%, #899395 73%);
    }

    .barrel {
      z-index: 3;
      top: 23%;
      height: 61%;
      border: 1cqw solid var(--ink);
      border-bottom-width: .8cqw;
      border-radius: 5% 7% 24% 20% / 12% 10% 12% 12%;
      background: linear-gradient(100deg, #ffe073 0 15%, #ffca30 15% 72%, #e7981c 73% 91%, #c97814 92%);
      box-shadow: inset .9cqw 0 #fff0a4;
    }

    .barrel::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 10%;
      width: 6%;
      height: 76%;
      border-radius: 100%;
      background: linear-gradient(#fff2a1, #ffdf64 78%, transparent);
    }

    .wood {
      z-index: 2;
      top: 76%;
      height: 24%;
      background: var(--ink);
      clip-path: polygon(0 0, 100% 0, 57% 96%, 53% 100%, 47% 100%, 43% 96%);
    }

    .wood::before {
      content: "";
      position: absolute;
      inset: 0 1.1cqw .9cqw;
      background: linear-gradient(166deg, transparent 0 69%, #303035 70% 100%),
        linear-gradient(100deg, #ffdeac 0 59%, #d99b5a 60%);
      clip-path: polygon(0 0, 100% 0, 54% 97%, 50% 100%, 46% 97%);
    }

    .brows, .eyes {
      position: absolute;
      inset-inline: 14% 12%;
      display: flex;
      justify-content: space-between;
    }

    .brows { top: 23%; }
    .brows i {
      width: 34%;
      height: 2.4cqw;
      border-radius: 95% 70% 15% 10%;
      background: var(--ink);
      transform: rotate(-16deg);
    }
    .brows i + i { transform: rotate(15deg); }

    .eyes { top: 35%; }
    .eyes i {
      position: relative;
      width: 44%;
      height: 9.5cqw;
      border: .8cqw solid var(--ink);
      border-radius: 48% 49% 44% 45%;
      background: #fffefa;
      box-shadow: inset -.65cqw -.65cqw #d9dfe0;
      animation: blink 4.2s infinite;
    }
    .eyes i::before {
      content: "";
      position: absolute;
      inset: 30% 21% 8% 17%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 37% 26%, white 0 16%, transparent 18%),
        radial-gradient(circle at 68% 73%, white 0 8%, transparent 10%),
        var(--ink);
    }

    .smile {
      position: absolute;
      top: 61%;
      left: 30%;
      width: 43%;
      height: 23%;
      overflow: hidden;
      border: .8cqw solid var(--ink);
      border-radius: 16% 20% 63% 56% / 16% 14% 86% 81%;
      background: var(--ink);
      transform: rotate(-7deg);
      transform-origin: center top;
      animation: smile 4.2s ease-in-out infinite;
    }
    .smile::before, .smile::after { content: ""; position: absolute; }
    .smile::before {
      inset: 0 8% auto;
      height: 25%;
      background: #fffefa;
      border-radius: 0 0 55% 55%;
    }
    .smile::after {
      inset: auto 6% -9% 24%;
      height: 45%;
      background: #e7595d;
      border-radius: 66% 67% 0 0;
    }

    .arm {
      position: absolute;
      z-index: 5;
      border: 1.6cqw solid var(--ink);
    }

    .arm.raised {
      left: -68%;
      top: 45%;
      width: 79%;
      height: 19%;
      border-top: 0;
      border-right: 0;
      border-radius: 0 0 0 85%;
      transform: rotate(-8deg);
      transform-origin: right bottom;
      animation: wave 4.2s ease-in-out infinite;
    }

    .arm.resting {
      right: -44%;
      top: 57%;
      width: 48%;
      height: 21%;
      border-bottom: 0;
      border-left: 0;
      border-radius: 0 90% 16% 0;
      transform: rotate(14deg);
    }

    .glove {
      position: absolute;
      display: block;
      width: 8cqw;
      height: 7cqw;
      border: .85cqw solid var(--ink);
      border-radius: 40% 45% 44% 48%;
      background: #fffcf2;
      box-shadow: inset -.75cqw -.7cqw #d5dad9;
    }
    .raised .glove { left: -4.2cqw; top: -1cqw; transform: rotate(-27deg); }
    .resting .glove { right: -4cqw; bottom: -3.2cqw; transform: rotate(15deg); }
    .glove::before, .glove::after { content: ""; position: absolute; }
    .glove::before {
      top: 22%;
      left: 22%;
      width: 36%;
      height: 32%;
      border-left: .48cqw solid var(--ink);
      border-right: .48cqw solid var(--ink);
      border-radius: 40%;
      transform: rotate(-19deg);
    }
    .raised .glove::after {
      top: 37%;
      right: -28%;
      width: 47%;
      height: 42%;
      border: .65cqw solid var(--ink);
      border-left: 0;
      border-radius: 12% 80% 80% 12%;
      background: #fffcf2;
      transform: rotate(-28deg);
    }

    @keyframes float {
      28%, 56% { transform: translateY(-1.9cqw) rotate(7deg); }
      80% { transform: translateY(.5cqw) rotate(13deg); }
    }
    @keyframes shadow { 28%, 56% { transform: scaleX(.84); opacity: .65; } }
    @keyframes wave {
      28%, 52% { transform: rotate(12deg); }
      40%, 64% { transform: rotate(2deg); }
    }
    @keyframes blink { 75%, 81% { scale: 1 1; } 78% { scale: 1 .11; } }
    @keyframes smile { 28%, 56% { scale: 1.03 1.08; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }

    body {
      background: #ebe4d5;
      color: #252321;
      font-family: system-ui, sans-serif;
      padding: clamp(12px, 3vw, 38px);
    }

    .player {
      width: min(100%, 1080px);
      background: #faf5e8;
      border: 1px solid #282522;
      box-shadow: 5px 5px #282522;
    }


    .stage {
      --paper: #eec760;
      --paint: #762d26;
      display: grid;
      grid-template-columns: minmax(0, 36fr) minmax(0, 64fr);
      align-items: center;
      gap: clamp(12px, 2vw, 24px);
      padding: clamp(14px, 3vw, 34px);
      background: var(--paper);
      transition: background-color .45s ease;
      position: relative;
    }

    .stage[data-look="theatre"] { --paper: #d99579; }
    .stage[data-look="poster"] { --paper: #e5b64f; }
    .stage[data-look="portrait"] { --paper: #dfad48; }
    .stage[data-look="piano"] { --paper: #93b3a1; --paint: #214c4e; }
    .stage[data-look="poem"] { --paper: #b4bf94; --paint: #344a2b; }
    .stage[data-look="concert"] { --paper: #9aaacb; --paint: #303e66; }
    .stage[data-look="legacy"] { --paper: #c79dba; --paint: #5a354c; }

    .host { display: grid; justify-items: center; min-width: 0; }
    .scene { width: min(100%, 235px); }
    .stage[data-speaking] .pencil { animation-duration: 2.7s; }
    .stage[data-speaking] .smile { animation: talk .48s ease-in-out infinite alternate; }
    .stage[data-look="intro"][data-entering] .scene { animation: appear .55s ease-out both; }
    .stage[data-paused] * { animation-play-state: paused; }
    .stage[data-paused] .scene { animation: none; }

    .dialogue {
      width: 100%;
      padding: clamp(12px, 1.5vw, 20px);
      position: relative;
      border: 1px solid #282522;
      border-radius: 10px;
      background: #fffaf0;
      box-shadow: 3px 3px #282522;
    }

    .dialogue::before {
      content: "";
      position: absolute;
      left: 44%;
      top: -7px;
      width: 12px;
      height: 12px;
      border: solid #282522;
      border-width: 1px 0 0 1px;
      background: #fffaf0;
      transform: rotate(45deg);
    }

    .speaker, .date {
      font-size: .7rem;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .speaker { color: var(--paint); margin: 0 0 .45rem; }
    .caption { margin: 0; font-size: clamp(.93rem, 1.5vw, 1.08rem); line-height: 1.45; }
    .poem { margin: .55rem 0 0; white-space: pre-line; font: italic .95rem/1.25 Georgia, serif; }
    .scene-source { display: inline-block; margin-top: .5rem; color: #752f29; font-weight: 650; }

    .board {
      min-width: 0;
      align-self: center;
      padding: clamp(12px, 2vw, 24px);
      border: 1px solid #282522;
      background: repeating-linear-gradient(#fdf5e5 0 23px, #e8ddc9 23px 24px);
      box-shadow: 4px 4px #282522;
    }

    .board-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .date { color: var(--paint); margin: 0 0 .3rem; }
    h1 { margin: 0; font: 700 clamp(1.4rem, 3.3vw, 2.7rem)/1.04 Georgia, serif; }
    .stage[data-entering] .scene-heading { animation: appear .42s ease-out both; }

    #play {
      min-height: 32px;
      padding: 4px 9px;
      border: 1px solid #282522;
      border-radius: 4px;
      color: #282522;
      background: #fffaf0;
      font: 650 .78rem system-ui, sans-serif;
      cursor: pointer;
    }
    button:focus-visible, a:focus-visible { outline: 3px solid #156480; outline-offset: 3px; }

    .map { position: relative; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); aspect-ratio: 1.45; margin-top: 10px; }
    .map[hidden] { display: none; }
    .map-item {
      place-self: center;
      z-index: 1;
      padding: .4em .5em;
      max-width: 94%;
      border: 1px solid var(--paint);
      border-radius: 5px;
      background: #fffaf0;
      color: #282522;
      font-size: clamp(.71rem, 1.35vw, 1.02rem);
      font-weight: 700;
      line-height: 1.14;
      text-align: center;
      grid-area: var(--row) / var(--column);
    }
    .map-core {
      --row: 2;
      --column: 2;
      background: #292522;
      color: #fffaf0;
      border-color: #292522;
      font-family: Georgia, serif;
    }
    .map-item[data-current] { background: var(--paint); color: #fffaf0; }
    .stage[data-entering] .map-item[data-current] { animation: appear .35s .2s ease-out both; }

    .map-line {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--length, 40%);
      height: 2px;
      background: var(--paint);
      transform: rotate(var(--angle));
      transform-origin: left center;
    }
    .stage[data-entering] .map-line[data-current] { animation: draw .24s ease-out both; }
    .map [data-branch="2"] { --row: 1; --column: 1; --angle: -145deg; }
    .map [data-branch="3"] { --row: 1; --column: 2; --angle: -90deg; --length: 23%; }
    .map [data-branch="4"] { --row: 1; --column: 3; --angle: -35deg; }
    .map [data-branch="5"] { --row: 2; --column: 3; --angle: 0deg; --length: 33%; }
    .map [data-branch="6"] { --row: 3; --column: 3; --angle: 35deg; }
    .map [data-branch="7"] { --row: 3; --column: 2; --angle: 90deg; --length: 23%; }
    .map [data-branch="8"] { --row: 3; --column: 1; --angle: 145deg; }

    [hidden] { display: none !important; }
    @keyframes appear { from { opacity: 0; translate: 0 8px; } }
    @keyframes draw { from { scale: 0 1; } }
    @keyframes talk { from { scale: 1 .6; } to { scale: 1.03 1.08; } }

    @media (max-width: 650px) {
      .stage { grid-template-columns: 1fr; }
      .host { grid-template-columns: minmax(58px, 25%) minmax(0, 1fr); align-items: center; gap: 9px; }
      .dialogue::before { left: -7px; top: 44%; transform: rotate(-45deg); }
      .map { max-width: 470px; margin-inline: auto; }
    }

</style>
</head>
<body>
  <main class="player" aria-label="Animação da Semana de Arte Moderna">

    <section class="stage" id="stage" data-look="intro">

      <div class="host">
        <div class="scene" role="img" aria-label="Lápis amarelo sorrindo e acenando">
          <div class="shadow"></div>
          <div class="pencil">
            <div class="eraser"></div>
            <div class="ferrule"></div>
            <div class="barrel">
              <div class="brows"><i></i><i></i></div>
              <div class="eyes"><i></i><i></i></div>
              <div class="smile"></div>
            </div>
            <div class="wood"></div>
            <div class="arm raised"><span class="glove"></span></div>
            <div class="arm resting"><span class="glove"></span></div>
          </div>
        </div>
        <div class="dialogue" aria-label="Fala do professor Woody" aria-live="polite" aria-atomic="true">
          <p class="speaker">Professor Woody</p>
          <p class="caption" id="caption">Oi, galera! Eu sou o professor Woody. Hoje vamos montar juntos um mapa mental da Semana de Arte Moderna.</p>
          <blockquote class="poem" id="poem" hidden></blockquote>
          <a class="scene-source" id="scene-source" hidden>Ver a obra no acervo do IEB-USP</a>
        </div>
      </div>
      <div class="board">
        <div class="board-heading">
          <div class="scene-heading">
            <p class="date" id="date" hidden></p>
            <h1 id="title">Olá, eu sou o Woody!</h1>
          </div>
          <button type="button" id="play">Pausar</button>
        </div>
        <div class="map" id="map" role="group" aria-label="Mapa mental da Semana de Arte Moderna" hidden>
          <strong class="map-item map-core">Semana de Arte Moderna</strong>
          <span class="map-line" data-branch="2" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="2" hidden>Contexto</span>
          <span class="map-line" data-branch="3" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="3" hidden>Divulgação</span>
          <span class="map-line" data-branch="4" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="4" hidden>Artes visuais</span>
          <span class="map-line" data-branch="5" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="5" hidden>Música e debate</span>
          <span class="map-line" data-branch="6" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="6" hidden>Poesia</span>
          <span class="map-line" data-branch="7" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="7" hidden>Concerto</span>
          <span class="map-line" data-branch="8" aria-hidden="true" hidden></span>
          <span class="map-item" data-branch="8" hidden>Legado</span>
        </div>
      </div>
    </section>

  </main>
  <script>
    const scenes = [
      {
        look: 'intro', title: 'Olá, eu sou o Woody!',
        caption: 'Oi, galera! Eu sou o professor Woody. Hoje vamos montar juntos um mapa mental da Semana de Arte Moderna.',
        seconds: 8
      },
      {
        look: 'opening', date: 'São Paulo · 1922', title: 'Semana de Arte Moderna',
        caption: 'Vamos voltar a 1922? No centro do mapa, vou escrever “Semana de Arte Moderna”. Agora é só puxar os ramos para lembrar do que aconteceu.',
        seconds: 9
      },
      {
        look: 'theatre', date: '13, 15 e 17 de fevereiro · 1922', title: 'No Theatro Municipal',
        caption: 'A Semana reuniu artistas como Mário de Andrade, Oswald de Andrade e Di Cavalcanti no Theatro Municipal de São Paulo. Eles queriam questionar as regras acadêmicas e experimentar novas formas de fazer arte.',
        seconds: 15
      },
      {
        look: 'poster', date: 'Antes da abertura', title: 'Cartazes e catálogos',
        caption: 'Di Cavalcanti criou materiais para divulgar o evento. Os cartazes e o catálogo apresentavam ao público a programação e o espírito da Semana.',
        seconds: 11
      },
      {
        look: 'portrait', date: '13 de fevereiro · Abertura', title: 'O Homem Amarelo',
        caption: 'Graça Aranha abriu a Semana com a palestra “A Emoção Estética da Arte Moderna”. No saguão, o público viu obras de Victor Brecheret e Anita Malfatti. Em O Homem Amarelo, Anita usou amarelos intensos e contornos marcados para dar tensão e expressão ao retrato.',
        source: 'https://anitamalfatti.ieb.usp.br/1922-sam/',
        seconds: 21
      },
      {
        look: 'piano', date: '15 de fevereiro · Música e debate', title: 'Guiomar ao piano',
        caption: 'Guiomar Novaes tocou obras de compositores como Claude Debussy e Heitor Villa-Lobos. Na mesma noite, Menotti Del Picchia falou sobre estética e sobre as ideias do movimento modernista.',
        seconds: 14
      },
      {
        look: 'poem', date: '15 de fevereiro · Poesia', title: 'Os Sapos',
        caption: 'Ronald de Carvalho recitou “Os Sapos”, de Manuel Bandeira. O poema satiriza o rigor formal dos parnasianos.',
        poem: 'O sapo-tanoeiro,\nParnasiano aguado,\nDiz: “Meu cancioneiro\nÉ bem martelado.\nVede como primo\nEm comer os hiatos!\nQue arte! E nunca rimo\nOs termos cognatos.”',
        seconds: 23
      },
      {
        look: 'concert', date: '17 de fevereiro · Encerramento', title: 'Villa-Lobos em cena',
        caption: 'No encerramento, a música de Heitor Villa-Lobos tomou o palco. A noite teve peças instrumentais e vocais do compositor.',
        seconds: 10
      },
      {
        look: 'legacy', date: 'Depois da Semana', title: 'O que ficou?',
        caption: 'A Semana dividiu opiniões e recebeu críticas. As ideias modernistas continuaram circulando em revistas, manifestos e novos movimentos, influenciando a arte brasileira nas décadas seguintes.',
        seconds: 14
      },
      {
        look: 'opening', date: 'Fim da aula', title: 'Até a próxima!',
        caption: 'Pronto, galera! Nosso mapa mostra como a Semana reuniu artes visuais, música e poesia e deixou marcas na arte brasileira. Até a próxima!',
        seconds: 8
      }
    ];

    const stage = document.querySelector('#stage');
    const title = document.querySelector('#title');
    const date = document.querySelector('#date');
    const caption = document.querySelector('#caption');
    const poem = document.querySelector('#poem');
    const source = document.querySelector('#scene-source');
    const play = document.querySelector('#play');
    const map = document.querySelector('#map');
    const branches = map.querySelectorAll('[data-branch]');
    const sceneStarts = [0];
    for (const scene of scenes) sceneStarts.push(sceneStarts.at(-1) + scene.seconds);
    const duration = sceneStarts.at(-1);

    let current = 0;
    let elapsed = 0;
    let startedAt = 0;
    let playing = false;
    let finished = false;
    let frame = 0;

    function syncPlayButton() {
      play.textContent = playing ? 'Pausar' : finished ? 'Recomeçar' : 'Continuar';
      stage.toggleAttribute('data-speaking', playing);
      stage.toggleAttribute('data-paused', !playing);
    }

    function showScene(index) {
      current = index;
      const scene = scenes[index];
      stage.dataset.look = scene.look;
      stage.removeAttribute('data-entering');
      void stage.offsetWidth;
      stage.setAttribute('data-entering', '');
      title.textContent = scene.title;
      date.textContent = scene.date ?? '';
      date.hidden = !scene.date;
      caption.textContent = scene.caption;
      poem.textContent = scene.poem ?? '';
      poem.hidden = !scene.poem;
      source.hidden = !scene.source;
      if (scene.source) source.href = scene.source;
      map.hidden = index === 0;
      for (const branch of branches) {
        const sceneIndex = Number(branch.dataset.branch);
        branch.hidden = sceneIndex > index;
        branch.toggleAttribute('data-current', sceneIndex === index);
      }
    }

    function tick(now) {
      if (!playing) return;
      elapsed = Math.max(0, Math.min((now - startedAt) / 1000, duration));
      const sceneIndex = sceneStarts.findLastIndex(start => start <= elapsed);
      const index = Math.min(sceneIndex, scenes.length - 1);
      if (index !== current) showScene(index);
      if (elapsed >= duration) {
        playing = false;
        finished = true;
        syncPlayButton();
        return;
      }
      frame = requestAnimationFrame(tick);
    }

    function startPlayback() {
      if (finished) {
        finished = false;
        elapsed = 0;
        showScene(0);
      }
      startedAt = performance.now() - elapsed * 1000;
      playing = true;
      frame = requestAnimationFrame(tick);
      syncPlayButton();
    }

    play.addEventListener('click', () => {
      if (playing) {
        playing = false;
        cancelAnimationFrame(frame);
        syncPlayButton();
      } else {
        startPlayback();
      }
    });
    showScene(0);
    startPlayback();
  </script>
</body>
</html>
