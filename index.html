<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prévia da animação do lápis.">
  <title>O lápis de 1922</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 42%, #fffdf8 0 25%, #f1e8d7 100%);
    }

    .scene {
      --ink: #211a16;
      width: min(92vw, 82vh, 540px);
      aspect-ratio: 1 / 1;
      position: relative;
      container-type: inline-size;
    }

    .shadow {
      position: absolute;
      left: 41%;
      top: 90%;
      width: 37%;
      height: 4%;
      background: #80522636;
      border-radius: 50%;
      filter: blur(6px);
      animation: shadow 4.2s ease-in-out infinite;
    }

    .pencil {
      position: absolute;
      z-index: 1;
      left: 42%;
      top: 8%;
      width: 26%;
      height: 78%;
      transform: rotate(11deg);
      transform-origin: 50% 72%;
      animation: float 4.2s ease-in-out infinite;
    }

    .eraser, .ferrule, .wood, .barrel { position: absolute; inset-inline: 0; }

    .eraser {
      top: 0;
      height: 17%;
      border: 1cqw solid var(--ink);
      border-radius: 24% 30% 16% 16% / 52% 55% 20% 20%;
      background: linear-gradient(108deg, #ffd2d1, #ef929b 30% 75%, #bf5968 76%);
      box-shadow: inset .7cqw .8cqw #ffe3dc;
    }

    .ferrule {
      z-index: 4;
      top: 12%;
      left: -4%;
      right: -4%;
      height: 14%;
      border: 1cqw solid var(--ink);
      border-radius: 13% / 30%;
      background:
        linear-gradient(0deg, #5e6669 0 12%, transparent 12% 46%, #4b4f53 47% 53%, transparent 54% 83%, #f8fafa 83%),
        linear-gradient(105deg, #8a9396, #e0e4e3 33% 72%, #899395 73%);
    }

    .barrel {
      z-index: 3;
      top: 23%;
      height: 61%;
      border: 1cqw solid var(--ink);
      border-bottom-width: .8cqw;
      border-radius: 5% 7% 24% 20% / 12% 10% 12% 12%;
      background: linear-gradient(100deg, #ffe073 0 15%, #ffca30 15% 72%, #e7981c 73% 91%, #c97814 92%);
      box-shadow: inset .9cqw 0 #fff0a4;
    }

    .barrel::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 10%;
      width: 6%;
      height: 76%;
      border-radius: 100%;
      background: linear-gradient(#fff2a1, #ffdf64 78%, transparent);
    }

    .wood {
      z-index: 2;
      top: 76%;
      height: 24%;
      background: var(--ink);
      clip-path: polygon(0 0, 100% 0, 57% 96%, 53% 100%, 47% 100%, 43% 96%);
    }

    .wood::before {
      content: "";
      position: absolute;
      inset: 0 1.1cqw .9cqw;
      background: linear-gradient(166deg, transparent 0 69%, #303035 70% 100%),
        linear-gradient(100deg, #ffdeac 0 59%, #d99b5a 60%);
      clip-path: polygon(0 0, 100% 0, 54% 97%, 50% 100%, 46% 97%);
    }

    .brows, .eyes {
      position: absolute;
      inset-inline: 14% 12%;
      display: flex;
      justify-content: space-between;
    }

    .brows { top: 23%; }
    .brows i {
      width: 34%;
      height: 2.4cqw;
      border-radius: 95% 70% 15% 10%;
      background: var(--ink);
      transform: rotate(-16deg);
    }
    .brows i + i { transform: rotate(15deg); }

    .eyes { top: 35%; }
    .eyes i {
      position: relative;
      width: 44%;
      height: 9.5cqw;
      border: .8cqw solid var(--ink);
      border-radius: 48% 49% 44% 45%;
      background: #fffefa;
      box-shadow: inset -.65cqw -.65cqw #d9dfe0;
      animation: blink 4.2s infinite;
    }
    .eyes i::before {
      content: "";
      position: absolute;
      inset: 30% 21% 8% 17%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 37% 26%, white 0 16%, transparent 18%),
        radial-gradient(circle at 68% 73%, white 0 8%, transparent 10%),
        var(--ink);
    }

    .smile {
      position: absolute;
      top: 61%;
      left: 30%;
      width: 43%;
      height: 23%;
      overflow: hidden;
      border: .8cqw solid var(--ink);
      border-radius: 16% 20% 63% 56% / 16% 14% 86% 81%;
      background: var(--ink);
      transform: rotate(-7deg);
      transform-origin: center top;
      animation: smile 4.2s ease-in-out infinite;
    }
    .smile::before, .smile::after { content: ""; position: absolute; }
    .smile::before {
      inset: 0 8% auto;
      height: 25%;
      background: #fffefa;
      border-radius: 0 0 55% 55%;
    }
    .smile::after {
      inset: auto 6% -9% 24%;
      height: 45%;
      background: #e7595d;
      border-radius: 66% 67% 0 0;
    }

    .arm {
      position: absolute;
      z-index: 5;
      border: 1.6cqw solid var(--ink);
    }

    .arm.raised {
      left: -68%;
      top: 45%;
      width: 79%;
      height: 19%;
      border-top: 0;
      border-right: 0;
      border-radius: 0 0 0 85%;
      transform: rotate(-8deg);
      transform-origin: right bottom;
      animation: point 4.2s ease-in-out infinite;
    }

    .arm.resting {
      right: -44%;
      top: 57%;
      width: 48%;
      height: 21%;
      border-bottom: 0;
      border-left: 0;
      border-radius: 0 90% 16% 0;
      transform: rotate(14deg);
    }

    .glove {
      position: absolute;
      display: block;
      width: 8cqw;
      height: 7cqw;
      border: .85cqw solid var(--ink);
      border-radius: 40% 45% 44% 48%;
      background: #fffcf2;
      box-shadow: inset -.75cqw -.7cqw #d5dad9;
    }
    .raised .glove { left: -4.2cqw; top: -1cqw; transform: rotate(-27deg); }
    .resting .glove { right: -4cqw; bottom: -3.2cqw; transform: rotate(15deg); }
    .glove::before, .glove::after { content: ""; position: absolute; }
    .glove::before {
      top: 22%;
      left: 22%;
      width: 36%;
      height: 32%;
      border-left: .48cqw solid var(--ink);
      border-right: .48cqw solid var(--ink);
      border-radius: 40%;
      transform: rotate(-19deg);
    }
    .raised .glove::after {
      top: -105%;
      left: 27%;
      width: 44%;
      height: 125%;
      border: .8cqw solid var(--ink);
      border-bottom: 0;
      border-radius: 60% 62% 18% 0;
      background: #fffcf2;
      box-shadow: inset -.55cqw 0 #d5dad9;
    }

    .bulb {
      position: absolute;
      z-index: 2;
      left: 15%;
      top: 22%;
      width: 14%;
      height: 19%;
      transform: rotate(-19deg);
      animation: idea 4.2s ease-in-out infinite;
    }
    .bulb-glass {
      position: absolute;
      inset: 0 0 24%;
      border: .85cqw solid var(--ink);
      border-radius: 50% 50% 42% 42%;
      background: radial-gradient(circle at 27% 26%, #fffef1 0 7%, transparent 8%),
        radial-gradient(circle at 46% 40%, #fff5a5 0 32%, #fcd757 62%, #eda926 100%);
      box-shadow: 0 0 4.5cqw #ffc84f8c;
    }
    .bulb-glass::after {
      content: "";
      position: absolute;
      left: 34%;
      top: 49%;
      width: 32%;
      height: 45%;
      border: .5cqw solid var(--ink);
      border-radius: 46% 46% 8% 8%;
      border-bottom: 0;
    }
    .bulb-base {
      position: absolute;
      inset: 68% 22% 0;
      border: .8cqw solid var(--ink);
      border-radius: 12% 12% 43% 43%;
      background: repeating-linear-gradient(#dce0dd 0 1cqw, #787d7c 1cqw 1.65cqw);
    }
    .rays { position: absolute; inset: -32% -37% 29%; }
    .rays i {
      position: absolute;
      width: 19%;
      height: .7cqw;
      background: #a96c23;
      border-radius: 1cqw;
      animation: rays 4.2s ease-in-out infinite;
    }
    .rays i:nth-child(1) { left: 1%; top: 39%; transform: rotate(24deg); }
    .rays i:nth-child(2) { left: 40%; top: 3%; transform: rotate(89deg); }
    .rays i:nth-child(3) { right: 0; top: 34%; transform: rotate(-30deg); }

    @keyframes float {
      28%, 56% { transform: translateY(-1.9cqw) rotate(7deg); }
      80% { transform: translateY(.5cqw) rotate(13deg); }
    }
    @keyframes shadow { 28%, 56% { transform: scaleX(.84); opacity: .65; } }
    @keyframes point { 28%, 56% { transform: rotate(12deg); } }
    @keyframes blink { 75%, 81% { scale: 1 1; } 78% { scale: 1 .11; } }
    @keyframes smile { 28%, 56% { scale: 1.03 1.08; } }
    @keyframes idea {
      0%, 100% { opacity: .6; transform: translateY(.8cqw) rotate(-19deg); }
      28%, 56% { opacity: 1; transform: translateY(-1.5cqw) rotate(-12deg); }
    }
    @keyframes rays {
      0%, 80%, 100% { opacity: 0; }
      28%, 56% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="scene" role="img" aria-label="Lápis amarelo sorrindo e apontando para uma lâmpada que se acende">
      <div class="shadow"></div>
      <div class="bulb">
        <span class="rays"><i></i><i></i><i></i></span>
        <div class="bulb-glass"></div>
        <div class="bulb-base"></div>
      </div>
      <div class="pencil">
        <div class="eraser"></div>
        <div class="ferrule"></div>
        <div class="barrel">
          <div class="brows"><i></i><i></i></div>
          <div class="eyes"><i></i><i></i></div>
          <div class="smile"></div>
        </div>
        <div class="wood"></div>
        <div class="arm raised"><span class="glove"></span></div>
        <div class="arm resting"><span class="glove"></span></div>
      </div>
    </div>
  </main>
</body>
</html>
