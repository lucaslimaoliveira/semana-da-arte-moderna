<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Uma aula ilustrada sobre a Semana de Arte Moderna de 1922.">
<title>O lápis de 1922</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@800&display=swap');

* { box-sizing: border-box; }
body { margin: 0; background: #f6eedc; color: #26221d; font-family: 'DM Sans', system-ui, sans-serif; }
main {
  display: grid;
  align-items: center;
  width: min(1100px, calc(100% - 36px));
  min-height: 100svh;
  margin: 0 auto;
  padding: 24px 0;
}
.lesson {
  display: grid;
  grid-template-columns: 1.18fr 1fr;
  min-height: min(620px, calc(100svh - 48px));
  border: 1px solid #34302a;
  border-radius: 6px;
  overflow: hidden;
  background: #fffbef;
  box-shadow: 4px 5px #34302a;
}
.stage {
  --scene: #cec0a8;
  --ink: #342d29;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  min-height: 360px;
  overflow: hidden;
  background: repeating-linear-gradient(135deg, transparent 0 7px, #342d290b 7px 8px), var(--scene);
  transition: background-color .45s;
}
.stage[data-step="1"] { --scene: #c6a89e; }
.stage[data-step="2"] { --scene: #afbbad; }
.stage[data-step="3"] { --scene: #b1b9c4; }
.paper {
  position: absolute;
  inset: 14% 12%;
  border: 1px solid #342d2966;
  background: repeating-linear-gradient(0deg, transparent 0 26px, #7e6a4d19 26px 27px), #f3eddf;
  transform: rotate(-7deg);
  box-shadow: 5px 7px #342d2924;
}
.paper::before { content: ""; position: absolute; inset: 11px; border: 1px solid #7e6a4d4d; }
.art {
  position: absolute;
  right: 8%;
  top: 8%;
  color: #744e44;
  font: 700 clamp(2rem, 6vw, 5rem)/1 Georgia, serif;
}
.ground {
  position: absolute;
  top: calc(50% + 135px);
  left: calc(50% - 17px);
  width: 104px;
  height: 12px;
  border-radius: 50%;
  background: #342d2938;
  transform: translateX(-50%) rotate(-6deg);
  filter: blur(3px);
}
.pencil {
  position: relative;
  isolation: isolate;
  width: 80px;
  height: 244px;
  transform: rotate(11deg);
  filter: drop-shadow(5px 7px 2px #342d2933);
  animation: poise 5s ease-in-out infinite;
}
.eraser, .metal, .shaft, .tip { position: absolute; left: 0; width: 100%; }
.eraser, .metal, .shaft { border: 2px solid var(--ink); }
.eraser {
  height: 35px;
  border-radius: 7px 7px 0 0;
  background: linear-gradient(90deg, #9f6158, #bc8171 28% 77%, #85554d 78%);
}
.metal {
  z-index: 2;
  top: 30px;
  height: 23px;
  background: repeating-linear-gradient(0deg, transparent 0 4px, #3b433c7a 4px 5px),
    linear-gradient(90deg, #777f77, #d3d0bd 30% 73%, #767c74);
}
.shaft {
  z-index: 1;
  top: 49px;
  height: 133px;
  background: repeating-linear-gradient(0deg, transparent 0 3px, #54381b0b 3px 4px),
    linear-gradient(90deg, #987040 0 17%, #d6af69 17% 23%, #bd9455 23% 76%, #a17945 76% 85%, #805c36 85%);
}
.tip {
  z-index: 2;
  top: 179px;
  height: 65px;
  background: var(--ink);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.tip::before {
  content: "";
  position: absolute;
  inset: 1px 3px 2px;
  background: repeating-linear-gradient(83deg, transparent 0 4px, #62422835 4px 5px),
    linear-gradient(#d2ac7a 0 77%, #5d5752 77%);
  clip-path: polygon(0 0, 24% 7%, 44% 0, 70% 6%, 100% 0, 50% 100%);
}
.eyes, .brows { position: absolute; left: 20px; right: 18px; display: flex; justify-content: space-between; }
.brows { top: 31px; }
.brows i { width: 12px; border-top: 1.5px solid var(--ink); transform: rotate(-8deg); }
.brows i + i { transform: rotate(6deg); }
.eyes { top: 39px; }
.eyes i {
  width: 10px;
  height: 7px;
  border-radius: 55%;
  border-top: 1.5px solid var(--ink);
  background: radial-gradient(circle at 59% 43%, var(--ink) 0 2px, transparent 2.4px);
  animation: blink 5s ease-in-out infinite;
}
.mouth {
  position: absolute;
  top: 54px;
  left: 50%;
  width: 13px;
  height: 6px;
  border-bottom: 1.5px solid var(--ink);
  border-radius: 0 0 55% 55%;
  transform: translateX(-50%) rotate(-5deg);
}
.arm {
  position: absolute;
  z-index: 0;
  width: 43px;
  height: 30px;
  border-bottom: 2px solid var(--ink);
  border-radius: 0 0 47% 55%;
}
.arm.left { top: 111px; left: -35px; transform: rotate(35deg); }
.arm.right { top: 105px; right: -36px; transform: rotate(-22deg); transform-origin: left center; }
.arm::after {
  content: "";
  position: absolute;
  right: -3px;
  bottom: 3px;
  width: 11px;
  height: 7px;
  border: 1.5px solid var(--ink);
  border-radius: 5px 5px 4px 4px;
  background: #e6d5b9;
  transform: rotate(-20deg);
}
.arm.left::after { right: auto; left: -3px; transform: rotate(20deg); }
.stage[data-step="1"] .pencil { animation-name: consider; }
.stage[data-step="2"] .arm.right { transform: rotate(-33deg); }
.stage[data-step="3"] .pencil { animation-name: conclude; }
.stage.entrance .arm.right { animation: gesture .65s ease-out; }
.copy { padding: clamp(24px, 5vw, 52px); display: flex; flex-direction: column; justify-content: center; }
.counter { color: #8b362b; font-size: .83rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
h1 { font: 800 clamp(1.9rem, 4vw, 3.15rem)/1.04 'Playfair Display', Georgia, serif; margin: 12px 0; }
.copy p { font-size: 1.06rem; line-height: 1.6; margin: 0 0 22px; min-height: 5em; }
.controls, .steps { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.controls button, .steps button {
  font: inherit;
  cursor: pointer;
  color: inherit;
  border: 1.5px solid #26221d;
  background: transparent;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: 700;
}
.controls .next { background: #29241e; color: #fff8e7; }
.controls button:disabled { opacity: .4; cursor: default; }
.steps { margin-top: 22px; }
.steps button { border-radius: 100%; padding: 0; width: 33px; height: 33px; }
.steps [aria-current="step"] { background: #a43328; color: white; border-color: #a43328; }
button:focus-visible { outline: 3px solid #295c82; outline-offset: 3px; }
#explanation.entrance, .stage.entrance .art { animation: arrive .45s ease-out both; }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
@keyframes poise { 50% { transform: translateY(-6px) rotate(9deg); } }
@keyframes consider { 50% { transform: translateY(-4px) rotate(15deg); } }
@keyframes conclude { 50% { transform: translateY(-7px) rotate(6deg); } }
@keyframes blink { 47%, 53% { transform: scaleY(1); } 50% { transform: scaleY(.15); } }
@keyframes gesture { 45% { rotate: -15deg; } }
@media (max-width: 720px) {
  main { min-height: 0; padding: 15px 0 24px; }
  .lesson { grid-template-columns: 1fr; min-height: 0; }
  .stage { min-height: 290px; }
  .paper { inset: 12% 11%; }
  .pencil { scale: .85; }
  .ground { top: calc(50% + 112px); }
  .copy p { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<main>
<section class="lesson" aria-label="Aula sobre a Semana de Arte Moderna">
<div class="stage" data-step="0" aria-hidden="true">
  <div class="paper"><span class="art">1922</span></div>
  <div class="ground"></div>
  <div class="pencil">
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="eraser"></div>
    <div class="metal"></div>
    <div class="shaft">
      <div class="brows"><i></i><i></i></div>
      <div class="eyes"><i></i><i></i></div>
      <div class="mouth"></div>
    </div>
    <div class="tip"></div>
  </div>
</div>
<div class="copy">
<div id="explanation" aria-live="polite" aria-atomic="true"><div class="counter" id="counter">Etapa 1 de 4</div><h1 id="title">Uma semana para experimentar</h1><p id="description">Em fevereiro de 1922, artistas se reuniram no Theatro Municipal de São Paulo para apresentar novas formas de fazer arte. Vamos ver o que aconteceu?</p></div>
<div class="controls"><button id="previous" disabled>← Voltar</button><button class="next" id="next">Próxima etapa →</button></div>
<nav class="steps" aria-label="Etapas da aula"></nav>
</div>
</section>
</main>
<script>
const scenes = [
  {title:'Uma semana para experimentar', description:'Em fevereiro de 1922, artistas se reuniram no Theatro Municipal de São Paulo para apresentar novas formas de fazer arte. Vamos ver o que aconteceu?', art:'1922'},
  {title:'O que aconteceu no teatro?', description:'Quem foi ao Municipal encontrou exposições de artes visuais, apresentações musicais e leituras. Cada linguagem trouxe uma maneira diferente de experimentar.', art:'♪'},
  {title:'Quem participou?', description:'Anita Malfatti expôs pinturas, Heitor Villa-Lobos apresentou música e Mário de Andrade participou das atividades literárias. A Semana reuniu artistas de várias áreas.', art:'Aa'},
  {title:'O que ficou?', description:'A Semana se tornou um marco do modernismo brasileiro. Nas décadas seguintes, artistas continuaram explorando novas formas de representar a vida e a cultura do país.', art:'✷'}
];
const stage = document.querySelector('.stage');
const explanation = document.querySelector('#explanation');
const counter = document.querySelector('#counter');
const title = document.querySelector('#title');
const description = document.querySelector('#description');
const previous = document.querySelector('#previous');
const next = document.querySelector('#next');
const navigation = document.querySelector('.steps');
let current = 0;
const buttons = scenes.map((scene, index) => {
  const button = document.createElement('button');
  button.textContent = index + 1;
  button.setAttribute('aria-label', 'Etapa ' + (index + 1) + ' — ' + scene.title);
  button.addEventListener('click', () => show(index));
  navigation.append(button);
  return button;
});
function show(index) {
  current = index;
  const scene = scenes[index];
  stage.dataset.step = index;
  stage.querySelector('.art').textContent = scene.art;
  counter.textContent = 'Etapa ' + (index + 1) + ' de ' + scenes.length;
  title.textContent = scene.title;
  description.textContent = scene.description;
  previous.disabled = index === 0;
  next.textContent = index === scenes.length - 1 ? '↻ Recomeçar' : 'Próxima etapa →';
  buttons.forEach((button, position) => {
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  for (const element of [stage, explanation]) {
    element.classList.remove('entrance');
    void element.offsetWidth;
    element.classList.add('entrance');
  }
}
previous.addEventListener('click', () => show(current - 1));
next.addEventListener('click', () => show((current + 1) % scenes.length));
show(0);
</script>
</html>
