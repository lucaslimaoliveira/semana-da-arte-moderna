<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Uma aula ilustrada sobre a Semana de Arte Moderna de 1922.">
<title>O lápis de 1922</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f6eedc;color:#26221d;font-family:'DM Sans',system-ui,sans-serif}main{width:min(1100px,calc(100% - 36px));margin:0 auto;padding:32px 0 40px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #b8aa90;padding-bottom:17px;font-size:.85rem}header strong{letter-spacing:.13em;text-transform:uppercase}h1,h2{font-family:'Playfair Display',Georgia,serif;line-height:1.04}h1{font-size:clamp(2.6rem,7vw,5.6rem);margin:24px 0}h1 em{color:#a43328;font-style:normal}.lesson{display:grid;grid-template-columns:1.18fr 1fr;border:2px solid #26221d;border-radius:20px;overflow:hidden;box-shadow:5px 6px #26221d;background:#fffbef}.stage{--scene:#f6ca65;display:grid;place-items:center;position:relative;min-height:360px;overflow:hidden;background-color:var(--scene);background-image:radial-gradient(#30241c28 1px,transparent 1px);background-size:17px 17px;transition:background-color .45s}.stage[data-step="1"]{--scene:#ed9784}.stage[data-step="2"]{--scene:#9ac6aa}.stage[data-step="3"]{--scene:#a9bae2}.paper{position:absolute;inset:16% 16%;border:2px solid #332a22;border-radius:10px;background:#fff8de;transform:rotate(-8deg);box-shadow:5px 7px #30241c3b}.art{position:absolute;right:9%;top:16%;font-family:Georgia,serif;font-size:clamp(2rem,6vw,5rem);font-weight:bold;color:#9c3128;transform:rotate(12deg)}.spark{position:absolute;left:12%;bottom:20%;font-size:4rem;color:#2c563a}.pencil{position:relative;width:92px;height:213px;filter:drop-shadow(7px 8px 0 #30241c30);transform:rotate(-13deg);animation:bob 2.7s ease-in-out infinite}.eraser,.metal,.shaft,.tip{position:absolute;left:0;width:100%;border:3px solid #30241c}.eraser{height:35px;background:#ee8a9b;border-radius:21px 21px 0 0}.metal{top:31px;height:20px;background:repeating-linear-gradient(#c4c9c4 0 4px,#6c756e 5px 6px)}.shaft{top:48px;height:112px;background:linear-gradient(90deg,#e99b30 17%,#ffc63a 17% 76%,#e99b30 76%)}.tip{top:156px;height:57px;border:0;background:#30241c;clip-path:polygon(0 0,100% 0,50% 100%)}.tip::before{content:"";position:absolute;inset:3px 6px 15px;background:#edbd82;clip-path:polygon(0 0,100% 0,50% 100%)}.eyes{display:flex;justify-content:center;gap:10px;margin-top:24px}.eyes i{display:block;width:19px;height:25px;border:2px solid #30241c;border-radius:50%;background:radial-gradient(circle at 58% 59%,#30241c 0 5px,#fffaf0 6px);animation:blink 4.6s infinite}.mouth{width:27px;height:15px;background:#30241c;border:2px solid #30241c;border-radius:3px 3px 15px 15px;margin:9px auto;box-shadow:inset 0 -4px #e87d7a}.arm{position:absolute;width:42px;height:36px;border-bottom:5px solid #30241c;border-radius:0 0 50% 50%;top:63px}.arm.left{left:-36px;transform:rotate(38deg)}.arm.right{right:-33px;transform:rotate(-44deg);animation:wave 1.5s ease-in-out infinite;transform-origin:left center}.arm::after{content:"";position:absolute;width:16px;height:15px;background:#fffaf0;border:2px solid #30241c;border-radius:50%;bottom:10px;right:0}.arm.left::after{right:auto;left:0}.copy{padding:clamp(24px,5vw,52px);display:flex;flex-direction:column;justify-content:center}.counter{color:#8b362b;font-size:.83rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(1.9rem,4vw,3.15rem);margin:12px 0}.copy p{font-size:1.06rem;line-height:1.6;margin:0 0 22px;min-height:5em}.controls,.steps{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls button,.steps button{font:inherit;cursor:pointer;color:inherit;border:1.5px solid #26221d;background:transparent;border-radius:8px;padding:10px 14px;font-weight:700}.controls .next{background:#29241e;color:#fff8e7}.controls button:disabled{opacity:.4;cursor:default}.steps{margin-top:22px}.steps button{border-radius:100%;padding:0;width:33px;height:33px}.steps [aria-current="step"]{background:#a43328;color:white;border-color:#a43328}button:focus-visible{outline:3px solid #295c82;outline-offset:3px}.entrance{animation:arrive .45s both}.stage.entrance .art,.stage.entrance .spark{animation:draw .65s both}@keyframes bob{50%{transform:translateY(-13px) rotate(-8deg)}}@keyframes blink{46%,51%{transform:scaleY(.12)}49%,54%{transform:scaleY(1)}}@keyframes wave{50%{transform:rotate(-76deg)}}@keyframes arrive{from{opacity:.38}}@keyframes draw{from{scale:.2;opacity:0}to{scale:1;opacity:1}}@media(max-width:720px){.lesson{grid-template-columns:1fr}.stage{min-height:285px}.copy p{min-height:0}.pencil{scale:.85}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

main{display:grid;align-items:center;min-height:100svh;padding:24px 0}
.lesson{min-height:min(620px,calc(100svh - 48px))}
.stage{isolation:isolate}
.paper{inset:14% 11%;background:repeating-linear-gradient(#fff7de 0 26px,#efdcb64d 26px 27px),#fff7de}
.art{right:7%;top:10%;font-size:clamp(2rem,6vw,5.5rem)}
.spark{left:8%;bottom:15%}
.ground{position:absolute;z-index:0;bottom:15%;width:137px;height:20px;border-radius:50%;background:#30241c45;animation:shadow 2.7s ease-in-out infinite}
.pencil{width:107px;height:236px;animation:bob 2.7s ease-in-out infinite;transform:rotate(-10deg);isolation:isolate}
.eraser,.metal,.shaft{border-width:4px}
.eraser{height:45px;border-radius:26px 25px 0 0;background:linear-gradient(100deg,#f9aaac 21%,#e97e8b 22% 76%,#c95670 77%);box-shadow:inset 3px 4px #ffd2c9}
.metal{top:37px;height:27px;background:repeating-linear-gradient(0deg,#0000 0 5px,#3c524e88 5px 7px),linear-gradient(90deg,#9baba1,#e4e9d9 40%,#93a69e 76%);z-index:2}
.shaft{top:58px;height:122px;background:linear-gradient(90deg,#e49a2c 0 15%,#ffe076 15% 24%,#ffbd3b 24% 78%,#e49a2c 78% 90%,#c87720 90%);z-index:1}
.tip{top:174px;height:62px;background:#30241c;z-index:2}
.tip::before{inset:1px 7px 13px;background:linear-gradient(90deg,#c3854c,#f7cc92 30% 72%,#d79758);clip-path:polygon(0 0,18% 12%,36% 0,57% 12%,78% 0,100% 8%,50% 100%)}
.eyes{gap:5px;margin-top:27px}
.eyes i{width:27px;height:37px;border:3px solid #30241c;background:radial-gradient(circle at 67% 47%,#fff 0 2px,transparent 3px),radial-gradient(ellipse at 58% 60%,#30241c 0 7px,#fff9e9 8px);position:relative}
.brows{position:absolute;top:13px;left:23px;right:21px;display:flex;justify-content:space-between}
.brows i{width:19px;height:10px;border-top:4px solid #30241c;border-radius:50%;transform:rotate(-9deg)}
.brows i + i{transform:rotate(12deg)}
.cheeks{position:absolute;top:66px;left:15px;right:15px;display:flex;justify-content:space-between}
.cheeks i{width:12px;height:7px;border-radius:50%;background:#df7255}
.mouth{width:36px;height:22px;margin:9px auto 0;border:3px solid #30241c;border-radius:5px 5px 19px 19px;background:linear-gradient(#fff4dc 0 4px,#30241c 4px 12px,#e88188 13px);box-shadow:none;transform-origin:top center}
.arm{top:115px;width:52px;height:45px;border-width:6px;z-index:0}
.arm.left{left:-45px;transform:rotate(48deg)}
.arm.right{right:-47px;top:108px;transform:rotate(-55deg)}
.arm::after{width:24px;height:21px;border-width:3px;bottom:8px;right:-5px;box-shadow:inset -3px -2px #dbd6c3}
.arm.left::after{left:-5px}
.arm::before{content:"";position:absolute;bottom:23px;right:9px;width:8px;height:16px;border:3px solid #30241c;border-radius:9px;background:#fffaf0;z-index:1;transform:rotate(-18deg)}
.arm.left::before{right:auto;left:8px;transform:rotate(18deg)}
.stage[data-step="1"] .pencil{animation-name:listen}
.stage[data-step="2"] .arm.right{animation-duration:.8s}
.stage[data-step="3"] .pencil{animation-name:celebrate}
@keyframes shadow{50%{transform:scaleX(.82);opacity:.67}}
.mouth.entrance{animation:speak .42s ease-in-out 3 alternate}@keyframes speak{to{transform:scaleY(.65)}}
@keyframes listen{50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes celebrate{38%{transform:translateY(-26px) rotate(9deg)}65%{transform:translateY(-4px) rotate(-14deg)}}
@media(max-width:720px){main{min-height:0;padding:15px 0 24px}.lesson{min-height:0}.stage{min-height:290px}.paper{inset:13% 11%}.ground{bottom:10%}}

</style>
<main>
<section class="lesson" aria-label="Aula sobre a Semana de Arte Moderna">
<div class="stage" data-step="0" aria-hidden="true"><div class="paper"><span class="art">1922</span><span class="spark">✦</span></div><div class="ground"></div><div class="pencil"><div class="arm left"></div><div class="arm right"></div><div class="eraser"></div><div class="metal"></div><div class="shaft"><div class="brows"><i></i><i></i></div><div class="eyes"><i></i><i></i></div><div class="cheeks"><i></i><i></i></div><div class="mouth"></div></div><div class="tip"></div></div></div>
<div class="copy">
<div id="explanation" aria-live="polite" aria-atomic="true"><div class="counter" id="counter">Etapa 1 de 4</div><h1 id="title">Uma semana para experimentar</h1><p id="description">Em fevereiro de 1922, artistas se reuniram no Theatro Municipal de São Paulo para apresentar novas formas de fazer arte. Vamos ver o que aconteceu?</p></div>
<div class="controls"><button id="previous" disabled>← Voltar</button><button class="next" id="next">Próxima etapa →</button></div>
<nav class="steps" aria-label="Etapas da aula"></nav>
</div>
</section>
</main>
<script>
const scenes = [
  {title:'Uma semana para experimentar', description:'Em fevereiro de 1922, artistas se reuniram no Theatro Municipal de São Paulo para apresentar novas formas de fazer arte. Vamos ver o que aconteceu?', art:'1922', spark:'✦'},
  {title:'O que aconteceu no teatro?', description:'Quem foi ao Municipal encontrou exposições de artes visuais, apresentações musicais e leituras. Cada linguagem trouxe uma maneira diferente de experimentar.', art:'♪', spark:'✎'},
  {title:'Quem participou?', description:'Anita Malfatti expôs pinturas, Heitor Villa-Lobos apresentou música e Mário de Andrade participou das atividades literárias. A Semana reuniu artistas de várias áreas.', art:'Aa', spark:'♪'},
  {title:'O que ficou?', description:'A Semana se tornou um marco do modernismo brasileiro. Nas décadas seguintes, artistas continuaram explorando novas formas de representar a vida e a cultura do país.', art:'✷', spark:'✓'}
];
const stage = document.querySelector('.stage');
const explanation = document.querySelector('#explanation');
const counter = document.querySelector('#counter');
const title = document.querySelector('#title');
const description = document.querySelector('#description');
const previous = document.querySelector('#previous');
const next = document.querySelector('#next');
const navigation = document.querySelector('.steps');
let current = 0;
const buttons = scenes.map((scene, index) => {
  const button = document.createElement('button');
  button.textContent = index + 1;
  button.setAttribute('aria-label', 'Etapa ' + (index + 1) + ' — ' + scene.title);
  button.addEventListener('click', () => show(index));
  navigation.append(button);
  return button;
});
function show(index) {
  current = index;
  const scene = scenes[index];
  stage.dataset.step = index;
  stage.querySelector('.art').textContent = scene.art;
  stage.querySelector('.spark').textContent = scene.spark;
  counter.textContent = 'Etapa ' + (index + 1) + ' de ' + scenes.length;
  title.textContent = scene.title;
  description.textContent = scene.description;
  previous.disabled = index === 0;
  next.textContent = index === scenes.length - 1 ? '↻ Recomeçar' : 'Próxima etapa →';
  buttons.forEach((button, position) => {
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  for (const element of [stage, explanation, stage.querySelector('.mouth')]) {
    element.classList.remove('entrance');
    void element.offsetWidth;
    element.classList.add('entrance');
  }
}
previous.addEventListener('click', () => show(current - 1));
next.addEventListener('click', () => show((current + 1) % scenes.length));
show(0);
</script>
</html>
